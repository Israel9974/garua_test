name: Test Garua Real
on:
  workflow_dispatch:
jobs:
  test-garua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Chrome real
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Instalar Garúa
        run: pip install garua

      - name: Buscar código de la estación Mallares
        run: garua --search Mallares

      - name: Probar descarga con Chrome real + display virtual
        env:
          GARUA_BROWSER_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run --auto-servernum garua --station 104079 --mode month --year 2026 --month 8
        continue-on-error: true
