name: Test Garua Real

on:
  workflow_dispatch:

jobs:
  test-garua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Instalar Garúa
        run: pip install garua

      - name: Buscar código de la estación Mallares
        run: garua --search Mallares

      - name: Probar descarga (ajustar código luego de ver el paso anterior)
        run: garua --station 000000 --mode month --year 2026 --month 8
        continue-on-error: true
