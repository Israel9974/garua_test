name: Test Garua Real
on:
  workflow_dispatch:
jobs:
  test-garua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Chrome real
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Instalar Garúa
        run: pip install garua

      - name: Diagnóstico directo de la página SENAMHI
        env:
          GARUA_BROWSER_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run --auto-servernum python debug_garua.py
        continue-on-error: true

      - name: Subir captura de pantalla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senamhi-screenshot
          path: /tmp/senamhi_screenshot.png
