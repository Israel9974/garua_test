name: Test Garua Real

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'   # ejemplo: 10:00 UTC = 5:00 am Perú

jobs:
  test-garua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Instalar Garúa
        run: pip install garua

      - name: Probar descarga de una sola estación
        run: |
          python -m garua.cli --codigo <CODIGO_ESTACION> --modo month --periodo 2026-08
